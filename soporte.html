<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Yo veo al usuario</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/rrweb@latest/dist/rrweb.min.js"></script>
</head>
<body style="font-family:Arial;background:#111;color:white;padding:15px">
<h2>Ver usuario en vivo</h2>
<input id="codigo" placeholder="Código ej: ABC123" value="ABC123" style="padding:10px;font-size:16px">
<button onclick="conectar()" style="padding:10px 15px;background:#25D366;border:none;border-radius:8px;cursor:pointer">Conectar</button>
<p id="estado">Sin conectar</p>
<div id="pantalla" style="background:white;width:100%;height:600px;border-radius:10px;overflow:hidden"></div>

<script>
const SUPABASE_URL = 'PEGA-AQUI-TU-URL';
const SUPABASE_KEY = 'PEGA-AQUI-TU-KEY';
const cliente = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let visor = null;

function conectar(){
  const codigo = document.getElementById('codigo').value.trim();
  document.getElementById('pantalla').innerHTML = '';
  visor = new rrweb.Replayer([], { root: document.getElementById('pantalla') });
  document.getElementById('estado').innerText = 'Esperando que el usuario toque el botón...';

  const canal = cliente.channel('soporte-' + codigo);
  canal.on('broadcast', {event: 'pantalla'}, ({payload}) => {
    visor.addEvent(payload);
    document.getElementById('estado').innerText = '🟢 EN VIVO - Viendo a: ' + codigo;
  });
  canal.subscribe();
}
</script>
</body>
</html>
